limit_req_zone $binary_remote_addr zone=azizam_api:1m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name azizam.178-104-74-99.sslip.io;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/azizam-acme;
        default_type text/plain;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name azizam.178-104-74-99.sslip.io;

    ssl_certificate /etc/letsencrypt/live/azizam.178-104-74-99.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/azizam.178-104-74-99.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 16k;
    client_body_timeout 10s;
    send_timeout 15s;
    limit_req_status 429;
    add_header X-Content-Type-Options nosniff always;

    location = /health {
        proxy_pass http://127.0.0.1:8093;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    location /api/ {
        limit_except GET POST OPTIONS { deny all; }
        limit_req zone=azizam_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8093;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }

    location / { return 404; }
}
